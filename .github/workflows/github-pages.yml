name: Deploy AERO ECHO Build 14

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-pages.yml
      - dist/**
      - runtime-build14.sha256

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/build-13/aero-echo-build13-fixed-github.zip
      BUNDLE_SHA256: a3639de52fa2e66ca43561cb7edeb36f635fec8aced9e0e53071a52469e46a69
    steps:
      - name: Check out the versioned Build 14 code and sprite corrections
        uses: actions/checkout@v4
      - name: Restore verified media and apply Build 14 corrections
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/aero-echo-build13-fixed-github.zip"
          curl --fail --location --retry 3 --retry-delay 3 "$BUNDLE_URL" -o "$archive"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$archive" | sha256sum --check -
          python - "$archive" "$GITHUB_WORKSPACE/site" <<'PY'
          import sys
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive, destination = sys.argv[1:]
          root = Path(destination)
          with ZipFile(archive) as bundle:
              members = [m for m in bundle.infolist() if m.filename.startswith('dist/')]
              assert members, 'The media bundle has no dist/ runtime'
              for member in members:
                  path = PurePosixPath(member.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  bundle.extract(member, root)
          assert (root / 'dist/index.html').is_file(), 'The game entry point is missing'
          print(f'Restored {len(members)} base runtime files')
          PY
          # Native-alpha atlas PNGs, embedded backups and code all come from the
          # same reviewed commit. The original large music/media bundle stays immutable.
          cp -a dist/. site/dist/
          cd site
          sha256sum --check "$GITHUB_WORKSPACE/runtime-build14.sha256"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified Build 14 runtime
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
