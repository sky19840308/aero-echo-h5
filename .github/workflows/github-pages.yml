name: Deploy AERO ECHO Build 29

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-pages.yml
      - dist/**
      - runtime-build29.sha256
      - tools/github/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/build-13/aero-echo-build13-fixed-github.zip
      BUNDLE_SHA256: a3639de52fa2e66ca43561cb7edeb36f635fec8aced9e0e53071a52469e46a69
    steps:
      - name: Check out the versioned Build 29 game
        uses: actions/checkout@v4
      - name: Restore verified media and apply Build 29
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/aero-echo-build13-fixed-github.zip"
          curl --fail --location --retry 3 --retry-delay 3 "$BUNDLE_URL" -o "$archive"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$archive" | sha256sum --check -
          python - "$archive" "$GITHUB_WORKSPACE/site" <<'PY'
          import sys
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive, destination = sys.argv[1:]
          root = Path(destination)
          with ZipFile(archive) as bundle:
              members = [m for m in bundle.infolist() if m.filename.startswith('dist/')]
              assert members, 'The media bundle has no dist/ runtime'
              for member in members:
                  path = PurePosixPath(member.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  bundle.extract(member, root)
          assert (root / 'dist/index.html').is_file(), 'The game entry point is missing'
          print(f'Restored {len(members)} base runtime files')
          PY
          # Native-alpha atlas PNGs, embedded backups and code all come from the
          # same reviewed commit. The original large music/media bundle stays immutable.
          python - "$GITHUB_WORKSPACE" <<'PY'
          import base64, hashlib, json, sys
          from pathlib import Path, PurePosixPath
          root = Path(sys.argv[1])
          transport = json.loads((root / 'tools/github/binary-manifest15.json').read_text())
          for entry in transport['files']:
              assert entry['target'] in {'dist/assets/music/ending-theme.mp3', 'tools/github/skin-manifest15.json', 'dist/assets/hero-bombs/nobunaga-actions.png', 'dist/assets/hero-bombs/takeda-actions.png', 'dist/assets/hero-bombs/hanzo-actions.png'}
              for part in entry['parts']:
                  path = PurePosixPath(part)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert part.startswith(('tools/github/binary-build15/', 'tools/github/binary-build24/'))
              payload = ''.join((root / part).read_text() for part in entry['parts'])
              data = base64.b64decode(payload, validate=True)
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              target = root / entry['target']
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY
          cp -a dist/. site/dist/
          python - "$GITHUB_WORKSPACE/site/dist/assets/manifest.json" "$GITHUB_WORKSPACE/tools/github/skin-manifest15.json" <<'PY'
          import json, sys
          from pathlib import Path
          target, patch = map(Path, sys.argv[1:])
          manifest = json.loads(target.read_text())
          update = json.loads(patch.read_text())
          assert set(update) == {'players', 'skinSet'}
          assert len(update['players']) == 3
          assert all(len(skins) == 4 for skins in update['players'].values())
          manifest.update(update)
          target.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')))
          PY
          cd site
          sha256sum --check "$GITHUB_WORKSPACE/runtime-build29.sha256"
      - name: Verify combat, lives, wingmen and native Canvas effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/tests
          cp -a tests/. site/tests/
          npm install --prefix "$RUNNER_TEMP/aero-echo-test-deps" --no-save @napi-rs/canvas
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/aero-echo-test-deps/node_modules"
          node site/tests/lives-bombs.mjs
          node site/tests/build27-combat.mjs
          node site/tests/wingmen.mjs
          node site/tests/talent-tree.mjs
          node site/tests/weapon-phases.mjs
          node site/tests/local-duo.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified Build 29 runtime
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
